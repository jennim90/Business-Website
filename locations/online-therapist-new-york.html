      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is your therapy style?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "My approach is structured, goal-oriented, and actively collaborative, designed to create momentum rather than simply provide a space to process. Each session has a clear agenda, with specific focal points identified at the start to ensure we are using our time purposefully. I incorporate in-session tasks and skill-building exercises that are immediately applicable to your daily life, because real change happens between sessions, not just within them.  My style is assessment-informed: I begin with a thorough understanding of your psychological profile, and treatment is calibrated accordingly. Progress is tracked and revisited regularly so you always know where we are and where we are headed. This is not passive listening, it is active, evidence-based clinical work with a clear direction."
          }
        },
        {
          "@type": "Question",
          "name": "How often should I attend therapy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Research consistently shows that weekly therapy produces the fastest and most durable results. A landmark meta-analysis found that approximately 50% of clients show significant improvement within 15 to 20 weekly sessions. Most clients begin weekly and shift to biweekly or monthly once their core goals have been achieved."
          }
        },
        {
          "@type": "Question",
          "name": "What can I expect in our first session?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The first session is a warm, comprehensive intake, a space to explore what brings you in, your history, your goals, and any questions about the process. There are no wrong answers. This time is used to genuinely understand your experience before building a treatment plan together."
          }
        },
        {
          "@type": "Question",
          "name": "How long does therapy last?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Duration depends on your goals and presentation. Some clients achieve meaningful progress in 12 to 20 focused sessions; others benefit from longer-term work. Regular check-ins ensure you always know where the work is heading and why."
          }
        },
        {
          "@type": "Question",
          "name": "How do I prepare for my first session?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No specific preparation is needed. Come as you are, with whatever is on your mind. If it is helpful, consider briefly what has brought you to therapy at this point in your life, and what you are hoping to feel or be different on the other side. The first session is designed to meet you exactly where you are."
          }
        },
        {
          "@type": "Question",
          "name": "Is virtual therapy as effective as in-person?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, and the research is clear on this. Multiple systematic reviews and randomized controlled trials have demonstrated that teletherapy produces outcomes equivalent to in-person treatment across a broad range of conditions. A 2020 meta-analysis published in World Psychiatry found no significant difference in treatment efficacy between in-person and video-based psychotherapy. For clients in New York City, this means you receive the same high standard of care online that you would in person, from a familiar, private environment where many people find they engage more deeply and with less anticipatory stress. It also eliminates New York City commute time and the expense of travel, keeping specialized care consistent, accessible, and easy to integrate into a busy schedule."
          }
        },
        {
          "@type": "Question",
          "name": "Can I get ADHD or autism (ASD) testing online in New York?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Research consistently shows that remote, tele-administered ADHD and autism (ASD) evaluation is valid and well supported when conducted by a trained psychologist using standardized instruments, with outcomes comparable to in-person testing. For New York clients, the entire process is conducted online through a secure, HIPAA-compliant platform, so your privacy is fully protected. Online testing also offers substantial benefits: greater convenience and access, no travel or time off for a commute, shorter waits for an appointment, flexible scheduling around work or school, lower cost and stress, and the comfort of being assessed in your own familiar environment. The resulting reports are comprehensive and board-compliant for workplace accommodations, school IEP and 504 plans, and standardized testing accommodations on exams such as the MCAT, LSAT, GRE, GMAT, SAT, and ACT."
          }
        },
        {
          "@type": "Question",
          "name": "Is virtual assessment and testing valid and effective?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Virtual administration of assessments is comparably effective and valid to in-person testing. Recent large-scale studies have confirmed that remote assessment yields equivalent results to traditional in-person evaluations when conducted by a trained clinician using standardized digital portals. The entire process is conducted through a secure, HIPAA-compliant platform, and the resulting reports are comprehensive and board-compliant for workplace accommodations, school IEP and 504 plans, and standardized testing accommodations."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a Comprehensive Neurodiagnostic Evaluation and a focused ADHD/ASD Evaluation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The primary difference lies in the inclusion of cognitive and intellectual functioning assessments. A Comprehensive Neurodiagnostic Evaluation is an all-inclusive investigation that integrates Full-Scale IQ and intellectual functioning testing to analyze the underlying architecture of your mind, measuring processing speed, working memory, and intellectual strengths. This provides the high-level data required for formal academic accommodations such as the SAT, GRE, MCAT, ACT, or LSAT.  A focused ADHD or ASD evaluation is a targeted diagnostic designed specifically to identify the presence of neurodivergence for personal clarity, therapy treatment planning, or medication management. It does not include full cognitive or IQ testing and is not sufficient for high-stakes accommodation documentation."
          }
        },
        {
          "@type": "Question",
          "name": "What is a psychoeducational evaluation, and why would I or my child need one?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Psychoeducational Evaluation focuses specifically on the intersection of cognitive processing and academic achievement. This assessment is designed to identify specific learning disorders, such as Dyslexia or Dyscalculia, by determining exactly how a student's brain handles information in an educational setting.  You would seek this evaluation if you or your child requires clinical proof for an IEP or 504 plan, or if you need to pinpoint why a student is struggling in subjects like reading or mathematics despite high effort. It moves beyond simple labels to provide a data-driven roadmap, differentiating between a primary learning disability and other factors like ADHD or anxiety that may be impacting classroom performance."
          }
        },
        {
          "@type": "Question",
          "name": "Why choose the dual diagnosis (ADHD & ASD) option?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Many individuals experience overlapping symptoms of both ADHD and Autism, often referred to as AuDHD. This combined evaluation uses a broader psychometric battery to accurately differentiate between these profiles, providing a more precise understanding of your neurodivergent experience. Given the symptom overlap, a dual evaluation ensures neither presentation is missed or misattributed to the other."
          }
        },
        {
          "@type": "Question",
          "name": "Can I upgrade from a \"Results Only\" session to a formal written report later?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. If you later realize you need formal documentation, for a medical provider, school, or accommodation request, a written report can be generated based on your existing assessment data for a supplementary fee of $300. You do not need to repeat the full evaluation."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer neurodiagnostic evaluations for ADHD and ASD?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, a core part of this practice. Comprehensive evaluations are available for children, adolescents, and adults. Multiple evaluation options are offered depending on your needs, from targeted ADHD/ASD diagnostics to full comprehensive neurodiagnostic evaluations with IQ testing. See the fees section for a full breakdown of services and what each includes."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between therapy and a psychological evaluation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Therapy is an ongoing process aimed at creating change, developing skills, processing past experiences, and working toward goals. A psychological or neurodiagnostic evaluation is a structured, time-limited assessment resulting in a detailed written report with diagnostic conclusions and actionable recommendations. Some clients do both: an evaluation to understand their profile, followed by therapy informed by that data."
          }
        },
        {
          "@type": "Question",
          "name": "Can I do therapy and an evaluation at the same time?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Many clients pursue an evaluation for diagnostic clarity and then begin therapy to act on the findings. Others begin therapy and pursue an evaluation later as specific questions emerge. Both can be coordinated to complement and strengthen each other."
          }
        },
        {
          "@type": "Question",
          "name": "Do you accept insurance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "This is a private-pay, out-of-network practice. A detailed superbill is provided after each session for potential insurer reimbursement. Checking out-of-network benefits via Reimbursify or Mentaya before the first appointment is recommended. Many clients receive significant reimbursement through their plans."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer virtual sessions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, fully virtual therapy and assessment consultations are available across 46 states via a HIPAA-compliant telehealth platform."
          }
        },
        {
          "@type": "Question",
          "name": "What is PSYPACT, and does it apply to me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PSYPACT is the Psychology Interjurisdictional Compact, an interstate agreement allowing licensed psychologists to provide telepsychology across member states. As a PSYPACT-certified psychologist, virtual therapy and assessment consultations are available across 46 states. Reach out directly to confirm your state is covered."
          }
        },
        {
          "@type": "Question",
          "name": "Is everything I share confidential?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Confidentiality is foundational to this work. Everything shared is protected by law and professional ethics. As a private-pay provider, records are never shared with insurance companies."
          }
        }
      ]
    }
